aid: humansand
name: Humansand
description: humans& (Humansand) is a human-centric frontier AI lab publicly introduced on January 20,
  2026. It aims to reimagine AI around people and their relationships, positioning models as connective
  tissue that strengthens organizations and communities rather than autonomous replacements. Its stated
  research agenda centers on long-horizon and multi-agent reinforcement learning, memory, and user understanding,
  tightly integrating scientific research with product development. The founding team has led work in
  reasoning, behavioral training, agents, and alignment across frontier industry and academic labs including
  xAI, Anthropic, Google DeepMind, OpenAI, Meta, Reflection, AI2, Stanford, and MIT. Its seed round is
  led by SV Angel and co-founder Georges Harik. As of this profile the company is pre-product with no
  publicly documented API, SDK, or developer platform.
